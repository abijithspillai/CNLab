<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CN Lab Programs</title>
    <meta name="description" content="Quick access to Computer Networks Java programs. Click once to copy, double click to view in code editor.">
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Prism.js for syntax highlighting (optional online, fallback provided offline) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Clean Header -->
        <header class="header">
            <div class="header-left">
                <h1>CN Lab Programs</h1>
                <p class="subtitle">Single click to copy &bull; Double click to view in Code Editor</p>
            </div>
            <div class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="searchInput" placeholder="Search files..." autocomplete="off">
                <button id="clearSearch" class="clear-btn" style="display: none;">&times;</button>
            </div>
        </header>

        <!-- Medium-Large Icons File Grid (Windows Folder Style) -->
        <main class="file-grid" id="fileGrid" role="list">
            <!-- Populated dynamically by app.js -->
        </main>

        <!-- Empty State -->
        <div id="noResults" class="no-results" style="display: none;">
            <p>No matching programs found</p>
        </div>
    </div>

    <!-- Code Editor Modal (Opened on Double Click) -->
    <div id="editorModal" class="editor-modal-overlay" style="display: none;">
        <div class="editor-window">
            <!-- Editor Titlebar -->
            <div class="editor-titlebar">
                <div class="editor-titlebar-left">
                    <span class="editor-tab">
                        <svg class="editor-tab-icon" viewBox="0 0 24 24" width="14" height="14" fill="#f97316">
                            <path d="M4 19h16v2H4zM20 4H4c-1.1 0-2 .9-2 2v9c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 11H4V6h16v9z"/>
                        </svg>
                        <span id="editorFileName">Program.java</span>
                        <span class="readonly-badge">READ ONLY</span>
                    </span>
                    <span class="editor-meta" id="editorFileMeta">0 lines &bull; 0 KB</span>
                </div>
                <div class="editor-titlebar-actions">
                    <button id="editorCopyBtn" class="editor-action-btn primary" title="Copy entire code">
                        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor">
                            <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                        </svg>
                        <span>Copy Code</span>
                    </button>
                    <button id="editorCloseBtn" class="editor-action-btn close" title="Close editor (Esc)">
                        &times;
                    </button>
                </div>
            </div>

            <!-- Editor Code Content with Line Numbers -->
            <div class="editor-body">
                <div class="line-numbers" id="editorLineNumbers"></div>
                <div class="code-container">
                    <pre><code id="editorCodeBlock" class="language-java"></code></pre>
                </div>
            </div>
        </div>
    </div>

    <!-- Floating Copy Toast Notification -->
    <div id="toast" class="toast">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </svg>
        <span id="toastMsg">Code copied to clipboard!</span>
    </div>

    <!-- Fallback Textarea for Copying -->
    <textarea id="copyHelper" style="position: absolute; left: -9999px;" aria-hidden="true"></textarea>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
    <script src="programs-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
